{% extends 'base.html' %}{% block content %}<div class="card auth"><h1>Secure EMI checkout</h1>{% if env=='sandbox' %}<p>Cashfree sandbox checkout: no real funds will be collected.</p>{% else %}<p>Secure Cashfree payment checkout.</p>{% endif %}<button class="primary full" onclick="openCheckout()">Open Cashfree checkout</button><p id="checkoutError" role="alert"></p><p class="muted">Payment confirmation happens only after verified webhook processing.</p></div><script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script><script>const cashfree=Cashfree({mode:{{env|tojson}}});function openCheckout(){cashfree.checkout({paymentSessionId:{{payment_session_id|tojson}},redirectTarget:'_self'}).catch(e=>{console.error(e);document.getElementById('checkoutError').textContent='Checkout could not open. Verify Cashfree credentials and domain configuration.';});}window.addEventListener('load',openCheckout);</script>{% endblock %}
