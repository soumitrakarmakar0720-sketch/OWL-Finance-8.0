{% extends 'base.html' %}{% block content %}<h1>Staff accounts</h1><form class='card' method='post'><input type='hidden' name='csrf' value='{{csrf}}'><label>Name <input name='name' required></label><label>Email <input name='email' type='email' required></label><label>Phone <input name='phone'></label><label>Temporary password (12+ characters) <input name='password' type='password' minlength='12' required></label><button class='primary'>Add staff</button></form>{% for s in staff %}<div class='item'>{{s.name}} · {{s.email}}</div>{% endfor %}{% endblock %}
