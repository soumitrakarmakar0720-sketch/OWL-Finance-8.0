{% extends 'base.html' %}{% block content %}<h1>Create loan offer</h1><p>Admin-created offers require borrower acceptance and KYC verification before disbursement.</p><form method='post' class='card'><input type='hidden' name='csrf' value='{{csrf}}'><label>Customer<select name='customer_id' required>{% for u in customers %}<option value='{{u.id}}'>{{u.name}} ({{u.email}})</option>{% endfor %}</select></label><label>Principal ₹<input name='principal' type='number' min='1' step='.01' required></label><label>Purpose<input name='purpose' required></label><label>Interest %<input name='rate' type='number' min='0' max='60' step='.001' required></label><label>Interest period<select name='rate_type'><option value='monthly'>Monthly</option><option value='annual'>Annual</option></select></label><label>Calculation<select name='method'><option value='flat'>Flat</option><option value='reducing'>Reducing</option></select></label><label>Tenure in months<input name='tenure' type='number' min='1' max='120' required></label><button class='primary'>Create offer</button></form>{% endblock %}
