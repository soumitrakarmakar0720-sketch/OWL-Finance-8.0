services:
  - type: web
    name: owl-finance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      - key: LIVE_LENDING_ENABLED
        value: 'false'
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/owl-finance-uploads
    disk:
      name: kyc-files
      mountPath: /var/data
      sizeGB: 1
